<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塔罗抽牌</title>
  <style>
    :root {
      --bg: #f4ecdc;
      --bg-deep: #d7c3a3;
      --paper: rgba(255, 250, 241, 0.92);
      --ink: #2d2219;
      --muted: #6d5a4b;
      --gold: #9f6f2b;
      --gold-deep: #6a4615;
      --line: rgba(79, 53, 24, 0.18);
      --accent: #7f1d1d;
      --shadow: 0 18px 40px rgba(57, 36, 16, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Noto Serif SC", "Songti SC", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(255, 245, 228, 0.92), transparent 35%),
        linear-gradient(135deg, rgba(126, 82, 31, 0.16), transparent 40%),
        linear-gradient(180deg, var(--bg), var(--bg-deep));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1120px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .hero {
      padding: 28px 28px 18px;
      background:
        linear-gradient(135deg, rgba(159, 111, 43, 0.18), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), rgba(255, 255, 255, 0));
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 0.96;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      max-width: 680px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
    }

    .panel {
      padding: 24px 24px 28px;
    }

    .controls {
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 248, 240, 0.7), rgba(248, 239, 224, 0.35));
    }

    .section-label {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold-deep);
    }

    .question-box,
    .status-box,
    .summary-box {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      padding: 14px 16px;
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .question-box {
      min-height: 112px;
      resize: vertical;
      font: inherit;
      line-height: 1.6;
    }

    .status-box,
    .summary-box {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primary {
      color: #fff8ee;
      background: linear-gradient(135deg, #8a2222, #5a0f0f);
      box-shadow: 0 12px 24px rgba(127, 29, 29, 0.22);
    }

    .secondary {
      color: var(--gold-deep);
      background: linear-gradient(135deg, #f5e7cc, #e6d0a8);
      box-shadow: 0 12px 24px rgba(123, 86, 28, 0.12);
    }

    .ghost {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .board {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .spread {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      min-height: 420px;
      align-items: stretch;
    }

    .spread[data-size="one"] {
      grid-template-columns: minmax(0, 420px);
      justify-content: center;
    }

    .spread[data-size="empty"] {
      grid-template-columns: minmax(0, 1fr);
    }

    .card {
      position: relative;
      min-height: 320px;
      border-radius: 24px;
      border: 1px solid rgba(122, 86, 29, 0.22);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(246, 237, 221, 0.82)),
        radial-gradient(circle at top, rgba(255, 214, 145, 0.18), transparent 40%);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 14px 24px rgba(57, 36, 16, 0.08);
      overflow: hidden;
      transform: translateY(8px);
      opacity: 0;
      animation: reveal 380ms ease forwards;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(159, 111, 43, 0.15);
      border-radius: 18px;
      pointer-events: none;
    }

    .card::after {
      inset: 18px;
      border-style: dashed;
      opacity: 0.4;
    }

    .card.empty {
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border-style: dashed;
      transform: none;
      opacity: 1;
      animation: none;
    }

    .card-head {
      position: relative;
      z-index: 1;
    }

    .position {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-deep);
    }

    .name {
      margin: 0;
      font-size: clamp(26px, 3vw, 34px);
      line-height: 1.06;
    }

    .english {
      margin: 8px 0 0;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-meta {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid rgba(122, 86, 29, 0.15);
      background: rgba(255, 255, 255, 0.78);
      color: var(--gold-deep);
    }

    .orientation-reversed {
      color: #fff6ed;
      background: linear-gradient(135deg, #8a2222, #5a0f0f);
      border-color: transparent;
    }

    .prompt {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
      color: var(--muted);
    }

    .footer-note {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes reveal {
      from {
        transform: translateY(10px) rotate(-0.6deg);
        opacity: 0;
      }
      to {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .controls {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .hero {
        padding: 22px 20px 16px;
      }

      .panel {
        padding: 20px;
      }

      .spread {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .card {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>塔罗抽牌</h1>
      <p class="subtitle">
        直接输入你此刻最想问的问题，抽完后把结果文本发给我，我再帮你解读。
        页面会优先尝试调用 ANU Quantum RNG 量子随机源；如果浏览器或网络拦截失败，会自动降级到 Web Crypto。
      </p>
    </header>

    <section class="layout">
      <aside class="panel controls">
        <p class="section-label">你的问题</p>
        <textarea id="question" class="question-box" placeholder="例如：我接下来三个月的工作方向是什么？"></textarea>

        <div class="actions">
          <button id="drawOne" class="primary">抽 1 张牌</button>
          <button id="drawThree" class="secondary">抽 3 张牌</button>
          <button id="copyResult" class="ghost">复制结果发给我</button>
        </div>

        <label class="toggle" for="allowReversed">
          <input id="allowReversed" type="checkbox" checked>
          <span>启用逆位</span>
        </label>

        <p class="section-label">随机源状态</p>
        <div id="status" class="status-box">等待抽牌。优先尝试 ANU QRNG 量子随机源。</div>

        <p class="section-label" style="margin-top: 18px;">回传给我</p>
        <div id="summary" class="summary-box">还没有抽牌结果。</div>
      </aside>

      <section class="panel board">
        <div id="spread" class="spread" data-size="empty" aria-live="polite">
          <article class="card empty">
            <p class="prompt">抽一张看核心指引，或抽三张看过去 / 现在 / 未来。</p>
          </article>
        </div>
        <p class="footer-note">
          提示：如果你特别在意“真随机”，建议联网状态下用现代浏览器打开此页面；页面会把本次实际使用的随机源写进结果里。
        </p>
      </section>
    </section>
  </main>

  <script>
    const MAJOR_ARCANA = [
      ["愚者", "The Fool"],
      ["魔术师", "The Magician"],
      ["女祭司", "The High Priestess"],
      ["皇后", "The Empress"],
      ["皇帝", "The Emperor"],
      ["教皇", "The Hierophant"],
      ["恋人", "The Lovers"],
      ["战车", "The Chariot"],
      ["力量", "Strength"],
      ["隐者", "The Hermit"],
      ["命运之轮", "Wheel of Fortune"],
      ["正义", "Justice"],
      ["倒吊人", "The Hanged Man"],
      ["死神", "Death"],
      ["节制", "Temperance"],
      ["恶魔", "The Devil"],
      ["高塔", "The Tower"],
      ["星星", "The Star"],
      ["月亮", "The Moon"],
      ["太阳", "The Sun"],
      ["审判", "Judgement"],
      ["世界", "The World"]
    ];

    const SUITS = [
      { zh: "权杖", en: "Wands" },
      { zh: "圣杯", en: "Cups" },
      { zh: "宝剑", en: "Swords" },
      { zh: "星币", en: "Pentacles" }
    ];

    const RANKS = [
      { zh: "王牌", en: "Ace" },
      { zh: "二", en: "Two" },
      { zh: "三", en: "Three" },
      { zh: "四", en: "Four" },
      { zh: "五", en: "Five" },
      { zh: "六", en: "Six" },
      { zh: "七", en: "Seven" },
      { zh: "八", en: "Eight" },
      { zh: "九", en: "Nine" },
      { zh: "十", en: "Ten" },
      { zh: "侍者", en: "Page" },
      { zh: "骑士", en: "Knight" },
      { zh: "王后", en: "Queen" },
      { zh: "国王", en: "King" }
    ];

    const POSITIONS = {
      one: ["核心"],
      three: ["过去", "现在", "未来"]
    };

    const deck = [
      ...MAJOR_ARCANA.map(([zh, en], index) => ({
        id: `M${index}`,
        zh,
        en,
        arcana: "大阿尔卡那"
      })),
      ...SUITS.flatMap((suit, suitIndex) =>
        RANKS.map((rank, rankIndex) => ({
          id: `m${suitIndex}-${rankIndex}`,
          zh: `${suit.zh}${rank.zh}`,
          en: `${rank.en} of ${suit.en}`,
          arcana: "小阿尔卡那",
          suit: suit.zh
        }))
      )
    ];

    class RandomProvider {
      constructor() {
        this.queue = [];
        this.currentSource = "未使用";
        this.lastMode = "idle";
        this.lastQuantumAttemptAt = 0;
        this.quantumCooldownMs = 10_000;
      }

      async nextUint16() {
        if (this.queue.length === 0) {
          await this.refill();
        }
        return this.queue.shift();
      }

      async refill() {
        const quantum = await this.tryQuantum();
        if (quantum.length > 0) {
          this.queue.push(...quantum);
          this.currentSource = "ANU QRNG 量子随机";
          this.lastMode = "quantum";
          return;
        }

        this.queue.push(...this.cryptoBatch(32));
        this.currentSource = "Web Crypto 加密伪随机";
        this.lastMode = "crypto";
      }

      async tryQuantum() {
        const now = Date.now();
        if (now - this.lastQuantumAttemptAt < this.quantumCooldownMs) {
          return [];
        }

        this.lastQuantumAttemptAt = now;

        try {
          const response = await fetch("https://qrng.anu.edu.au/API/jsonI.php?length=32&type=uint16", {
            method: "GET",
            mode: "cors",
            cache: "no-store"
          });
          if (!response.ok) {
            return [];
          }

          const payload = await response.json();
          if (!payload || payload.success !== true || !Array.isArray(payload.data)) {
            return [];
          }

          return payload.data
            .map((value) => Number(value))
            .filter((value) => Number.isInteger(value) && value >= 0 && value <= 65535);
        } catch (error) {
          return [];
        }
      }

      cryptoBatch(length) {
        const buffer = new Uint16Array(length);
        crypto.getRandomValues(buffer);
        return Array.from(buffer);
      }
    }

    const provider = new RandomProvider();
    const questionEl = document.getElementById("question");
    const allowReversedEl = document.getElementById("allowReversed");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const spreadEl = document.getElementById("spread");
    const drawOneBtn = document.getElementById("drawOne");
    const drawThreeBtn = document.getElementById("drawThree");
    const copyResultBtn = document.getElementById("copyResult");

    let latestSummary = "";

    function setBusy(isBusy) {
      drawOneBtn.disabled = isBusy;
      drawThreeBtn.disabled = isBusy;
      copyResultBtn.disabled = isBusy;
    }

    async function uniformIndex(maxExclusive) {
      if (maxExclusive <= 0) {
        throw new Error("maxExclusive 必须大于 0");
      }

      const limit = Math.floor(65536 / maxExclusive) * maxExclusive;
      while (true) {
        const value = await provider.nextUint16();
        if (value < limit) {
          return value % maxExclusive;
        }
      }
    }

    async function pickCards(count, allowReversed) {
      const pool = [...deck];
      const results = [];

      for (let i = 0; i < count; i += 1) {
        const pick = await uniformIndex(pool.length);
        const card = pool.splice(pick, 1)[0];
        let reversed = false;
        if (allowReversed) {
          reversed = (await provider.nextUint16()) >= 32768;
        }
        results.push({ ...card, reversed });
      }

      return results;
    }

    function renderCards(cards, spreadType) {
      const positions = POSITIONS[spreadType];
      spreadEl.dataset.size = spreadType;
      spreadEl.innerHTML = cards.map((card, index) => `
        <article class="card" style="animation-delay:${index * 70}ms">
          <div class="card-head">
            <p class="position">${positions[index]}</p>
            <h2 class="name">${card.zh}</h2>
            <p class="english">${card.en}</p>
          </div>
          <div class="card-meta">
            <div class="badge-row">
              <span class="badge">${card.arcana}</span>
              ${card.suit ? `<span class="badge">${card.suit}</span>` : ""}
              <span class="badge ${card.reversed ? "orientation-reversed" : ""}">
                ${card.reversed ? "逆位" : "正位"}
              </span>
            </div>
            <p class="prompt">${positionPrompt(spreadType, index)}</p>
          </div>
        </article>
      `).join("");
    }

    function positionPrompt(spreadType, index) {
      if (spreadType === "one") {
        return "这张牌代表你现在最需要直面的核心信息。";
      }

      return [
        "这张牌指向事情的起点、根源或先前积累的状态。",
        "这张牌代表你此刻最真实的处境与正在发生的能量。",
        "这张牌展示后续趋势，以及你若保持当前路径可能走向的方向。"
      ][index];
    }

    function buildSummary(cards, spreadType) {
      const question = questionEl.value.trim() || "未填写具体问题";
      const positions = POSITIONS[spreadType];
      const lines = [
        `问题：${question}`,
        `牌阵：${spreadType === "one" ? "单张指引" : "过去 / 现在 / 未来"}`,
        `随机源：${provider.currentSource}`,
        ...cards.map((card, index) => `${positions[index]}：${card.zh}（${card.reversed ? "逆位" : "正位"}） / ${card.en}`)
      ];
      return lines.join("\n");
    }

    function setStatus(message, tone) {
      const color = tone === "warn" ? "#7f1d1d" : "var(--muted)";
      statusEl.style.color = color;
      statusEl.textContent = message;
    }

    async function draw(spreadType) {
      setBusy(true);
      setStatus("正在洗牌并请求随机数……", "normal");

      try {
        const count = spreadType === "one" ? 1 : 3;
        const cards = await pickCards(count, allowReversedEl.checked);
        renderCards(cards, spreadType);

        latestSummary = buildSummary(cards, spreadType);
        summaryEl.textContent = latestSummary;

        if (provider.lastMode === "quantum") {
          setStatus("本次已使用 ANU QRNG 量子随机源。", "normal");
        } else {
          setStatus("本次未能取到外部真随机，已自动降级到 Web Crypto。", "warn");
        }
      } catch (error) {
        setStatus(`抽牌失败：${error.message}`, "warn");
      } finally {
        setBusy(false);
      }
    }

    async function copySummary() {
      if (!latestSummary) {
        setStatus("还没有结果可复制，先抽牌。", "warn");
        return;
      }

      try {
        await navigator.clipboard.writeText(latestSummary);
        setStatus("结果已复制，直接发给我即可。", "normal");
      } catch (error) {
        setStatus("复制失败。你可以手动选中右侧文本发给我。", "warn");
      }
    }

    drawOneBtn.addEventListener("click", () => draw("one"));
    drawThreeBtn.addEventListener("click", () => draw("three"));
    copyResultBtn.addEventListener("click", copySummary);
  </script>
</body>
</html>
